<style>
:root{--bg:#f2fbf9;--card:#fff;--ink:#14343a;--muted:#5d7a7f;--line:#d5ebe7;--brand:#0b8f87;--brand-d:#07645f;--brand-l:#d9f3ef;--on:#fff;

--warn-l:#3b1f19;--ok-l:#173626;--amber-l:#3a2d10;--ok-t:#7fe3a6;--am-t:#f2c660;--wa-t:#ff9e85;--inp:#0f2023;--pat:.2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}html.big{font-size:20px}
body{margin:0;color:var(--ink);background-color:var(--bg);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,-apple-system,Arial,sans-serif;line-height:1.55;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;flex:none}
header h1{font-size:1.2rem;margin:0;line-height:1.1}header small{color:var(--muted);font-size:.74rem}
.spacer{flex:1}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:.85rem;cursor:pointer;min-height:38px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:is(.chip,button,input,select,textarea):focus-visible{outline:3px solid #7fd6cf;outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:1.15rem;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px;margin-bottom:10px;font-size:.92rem}
.banner.warn{background:var(--warn-l);border:1px solid var(--warn)}.banner.amber{background:var(--amber-l);border:1px solid #d9a93a}.banner.info{background:var(--brand-l);border:1px solid var(--brand)}
.grow{flex:1}
.dose{display:flex;align-items:center;gap:12px}
.dose .time{font-weight:700;font-size:1.1rem;min-width:3.6em;color:var(--brand-d);direction:ltr;text-align:center}
.dose .ic{font-size:1.6rem}.dose .info{flex:1;min-width:0}.dose .name{font-weight:700;overflow-wrap:anywhere}.sub{color:var(--muted);font-size:.85rem}
.badge{border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.b-taken{background:var(--ok-l);color:var(--ok-t)}.b-skipped{background:var(--amber-l);color:var(--am-t)}.b-missed{background:var(--warn-l);color:var(--wa-t)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;min-height:44px;background:var(--brand);color:var(--on)}
.btn.sec{background:var(--brand-l);color:var(--brand-d)}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--warn);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.88rem;border-radius:12px}.btn.block{width:100%}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--inp);color:var(--ink);min-height:44px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;margin:0;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card)}
.days input{width:auto;min-height:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 6px;min-height:42px}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}
nav{position:fixed;bottom:0;inset-inline:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:6px 1px;color:var(--muted);font-size:.66rem;display:flex;flex-direction:column;align-items:center;min-height:58px;min-width:0}
nav button span{font-size:1.3rem;line-height:1.25}
nav button[aria-current=page]{color:var(--brand-d);font-weight:700;background:var(--brand-l)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,30,34,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.ring{text-align:center}.ring .big-ic{width:84px;height:84px;border-radius:20px;animation:wob 1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.ring .big-ic{animation:none}}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--brand-l);border-radius:14px;padding:10px 4px}.stat b{display:block;font-size:1.4rem;color:var(--brand-d)}.stat span{font-size:.78rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
.tablewrap{overflow-x:auto}.empty{text-align:center;color:var(--muted);padding:24px 10px}.e-ic{font-size:2.6rem}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.disc{font-size:.8rem;color:var(--muted);text-align:center;margin:16px 0}
.toast{position:fixed;inset-inline:0;bottom:84px;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:.9rem}
.pid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}.pid dt{color:var(--muted)}.pid dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.streak{display:flex;align-items:center;gap:12px}.streak .n{font-size:2rem;font-weight:800;color:var(--brand-d)}
.printhead{display:none}
.blood{font-size:2.6rem;font-weight:800;color:var(--warn);text-align:center;direction:ltr}
@media print{body{background:#fff;color:#000}header,nav,.noprint,.toast{display:none!important}.printhead{display:block;text-align:center;font-size:1.3rem;font-weight:700;margin-bottom:8px}.card{break-inside:avoid;border-color:#999}}
</style>
</head>

function drugsOf(name){const n=name.toLowerCase();return DB.filter(d=>d.al.some(a=>a.length>=4&&n.includes(a)))}
function findInteractions(meds){
  const info=meds.map(m=>({m,ds:drugsOf(m.name)})),out=[],seen=new Set();
  const has=(x,k)=>x.ds.some(d=>d.id===k||d.g.includes(k));
  RULES.forEach(([a,b,sev,msg])=>info.forEach(x=>info.forEach(y=>{
    if(x===y||!has(x,a)||!has(y,b))return;const key=[x.m.id,y.m.id].sort().join()+a+b;if(seen.has(key))return;seen.add(key);
    out.push({a:x.m.name,b:y.m.name,sev,msg});})));
  return out;
}

/* ================= schedule logic ================= */
function activeOn(m,date){
  if(m.mode==='prn')return false;
  const ds=ymd(date),st=m.start||ds;if(ds<st)return false;
  const diff=Math.round((new Date(ds)-new Date(st))/864e5);
  if(m.dur&&diff>=m.dur)return false;
  if(m.every>1&&diff%m.every!==0)return false;
  if(m.days&&m.days.length&&!m.days.includes(date.getDay()))return false;
  return true;
}
function dosesFor(date,all){
  const out=[];(all?S.meds:myMeds()).forEach(m=>{if(activeOn(m,date))m.times.forEach(tm=>out.push({med:m,time:tm}))});
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
const keyOf=(d,dose)=>d+'|'+dose.med.id+'|'+dose.time;
function setStatus(k,s){
  const prev=S.log[k];S.log[k]={s,ts:Date.now()};
  const m=S.meds.find(x=>x.id===k.split('|')[1]);
  if(s==='taken'&&m&&m.stock!==''&&m.stock!=null&&(!prev||prev.s!=='taken'))m.stock=Math.max(0,Number(m.stock)-1);
  save();
}
function tick(){
  const now=new Date(),d=ymd(now),mins=now.getHours()*60+now.getMinutes();let ch=false;
  for(const dose of dosesFor(now,true)){
    const k=keyOf(d,dose);if(S.log[k])continue;const dm=toMin(dose.time);
    if(mins-dm>=60){S.log[k]={s:'missed',ts:Date.now()};S.alerts.push(k);ch=true;if(ringing&&ringing.k===k)closeRing()}
    else if(mins>=dm&&!ringing&&!((snooze[k]||0)>Date.now()))ring(dose,k);
  }
  S.appts.forEach(a=>{
    if(a.notified)return;const at=new Date(a.date+'T'+a.time).getTime(),n=Date.now();
    if(n>=at-a.remind*60000&&n<at+3*3600e3){a.notified=true;ch=true;beep();notify('📅 '+a.title,(a.place||'')+' '+a.time,'a'+a.id);toast('📅 '+a.title+' — '+a.time)}
  });
  if(ch){save();render()}
}
setInterval(tick,15000);
let pstT;function pushSchedule(){clearTimeout(pst);pst=setTimeout(()=>{
  const LN=nativeLN();if(!LN&&(!navigator.serviceWorker||!navigator.serviceWorker.controller))return;
  const items=[],now=new Date();
  for(let i=0;i<(LN?7:2);i++){const dt=new Date(now);dt.setDate(now.getDate()+i);const d=ymd(dt);
    dosesFor(dt,true).forEach(ds=>{const k=keyOf(d,ds);if(S.log[k])return;const [h,m]=ds.time.split(':');
      items.push({id:k,at:new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),+h,+m).getTime(),title:'💊 '+t('ringTitle'),body:ds.med.name+(ds.med.dose?' — '+ds.med.dose:'')})})}
  S.appts.forEach(a=>{if(!a.notified)items.push({id:'a'+a.id,at:new Date(a.date+'T'+a.time).getTime()-a.remind*60000,title:'📅 '+a.title,body:(a.place||'')+' '+a.time})});
  if(LN)return scheduleNative(LN,items);navigator.serviceWorker.controller.postMessage({type:'sched',items})},400)}

/* native Android (Capacitor): alarms scheduled by the OS, work with app closed */
function nativeLN(){const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications)&&C.Plugins.LocalNotifications}
const nid=x=>{let h=0;for(const c of String(x))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2147483000+1};
async function scheduleNative(LN,items){
  try{
    const pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const now=Date.now(),list=items.filter(i=>i.at>now).slice(0,300).map(i=>({id:nid(i.id),title:i.title,body:i.body,channelId:'meds',schedule:{at:new Date(i.at),allowWhileIdle:true}}));
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){}
}
async function initNative(){
  const LN=nativeLN();if(!LN)return;
  try{
    await LN.requestPermissions();
    await LN.createChannel({id:'meds',name:'Medication reminders',importance:5,visibility:1,vibration:true,lights:true});
    const ex=await LN.checkExactNotificationSetting();
    if(ex&&ex.exact_alarm==='denied')await LN.changeExactNotificationSetting();
  }catch(e){}
  pushSchedule();
}

/* streak: consecutive days with all doses taken */
function streak(){
  let n=0;const now=new Date();
  for(let i=0;i<120;i++){const dt=new Date(now);dt.setDate(now.getDate()-i);const ds=ymd(dt),dz=dosesFor(dt,false);
    if(!dz.length)continue;
    const st=dz.map(x=>(S.log[keyOf(ds,x)]||{}).s);
    if(st.every(s=>s==='taken')){n++;continue}
    if(i===0&&st.every(s=>!s||s==='taken')&&!st.some(s=>s==='skipped'))continue;
    break;
  }
  return n;
}

const TONES={bell:[[880,0,.22,'sine'],[1175,.25,.22,'sine'],[880,.5,.22,'sine']],digital:[[1000,0,.12,'square'],[1000,.2,.12,'square'],[1000,.4,.12,'square'],[1000,.6,.12,'square']],melody:[[523,0,.2,'triangle'],[659,.22,.2,'triangle'],[784,.44,.2,'triangle'],[1047,.66,.4,'triangle']]};
function beep(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    (TONES[S.tone]||TONES.bell).forEach(([f,o,dur,w])=>{const os=actx.createOscillator(),g=actx.createGain();os.type=w;os.frequency.value=f;
      const t0=actx.currentTime+o,vol=w==='square'?.12:.4;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
      os.connect(g).connect(actx.destination);os.start(t0);os.stop(t0+dur+.05)})}catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,150,300]);
}
function speak(txt){try{if(!S.voice||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE[S.lang][0];speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});
  else try{new Notification(title,o)}catch(e){}
}

function chartSvg(series,colors){
  const all=series.flat();if(!all.length)return'';const W=320,H=120,pd=26;let mn=Math.min(...all),mx=Math.max(...all);if(mn===mx){mn-=1;mx+=1}
  const n=series[0].length,x=i=>pd+(n===1?(W-2*pd)/2:i*(W-2*pd)/(n-1)),y=v=>H-pd+4-(v-mn)/(mx-mn)*(H-2*pd);

  series.forEach((a,si)=>{s+=`<polyline fill="none" stroke="${colors[si]}" stroke-width="2.5" points="${a.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${colors[si]}"/>`).join('')});

function patternTxt(m){
  if(m.mode==='prn')return t('prn');
  const dn=(m.days&&m.days.length&&m.days.length<7)?m.days.map(i=>t('d')[i].slice(0,3)).join('، '):'';
  return '🕒 '+m.times.join(' • ')+(dn?' — '+dn:'')+(m.every>1?' — '+t('everyN').replace('{n}',m.every):'')+(m.dur?' — '+t('forN').replace('{n}',m.dur):'');
}

  <div style="display:grid;gap:8px;margin-top:14px">${ph?`<a class="btn red block" style="text-align:center;text-decoration:none;display:block;line-height:22px" href="tel:+${ph}">${t('call')}</a>`:''}
  <button class="btn sec block" id="emImg">${t('saveImg')}</button><button class="btn ghost block" id="emClose">${t('cancel')}</button></div>`);
  $('#emClose').onclick=closeModal;
  $('#emImg').onclick=()=>{
    const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,1080,1920);x.fillStyle='#e4572e';x.fillRect(0,0,1080,230);
    x.textAlign='center';x.direction=S.lang==='ar'?'rtl':'ltr';x.fillStyle='#fff';x.font='bold 90px sans-serif';x.fillText('🚨 '+t('emergency'),540,150);
    x.fillStyle='#e4572e';x.font='bold 220px sans-serif';x.fillText(p.blood||'?',540,480);
    x.fillStyle='#14343a';x.font='bold 70px sans-serif';
    let y=620;const line=(lb,v,big)=>{x.fillStyle='#5d7a7f';x.font='42px sans-serif';x.fillText(lb,540,y);y+=70;x.fillStyle='#14343a';x.font='bold '+(big?78:58)+'px sans-serif';
      const words=String(v||'—').split(' ');let cur='';words.forEach(w=>{if(x.measureText(cur+' '+w).width>940){x.fillText(cur,540,y);y+=70;cur=w}else cur=(cur?cur+' ':'')+w});x.fillText(cur,540,y);y+=110};
    line(t('pName'),p.name,true);line(t('pAge')+' / '+t('pWeight'),(p.age||'—')+' / '+(p.weight||'—'));line(t('pAllergy'),p.allergy);line(t('meds'),ms);line(t('pFam'),(p.fam||'')+' '+(p.famPhone||''));
    c.toBlob(b=>down('sahati-emergency.png',b));
  };
}
function settingsModal(){
  openModal(`<h2 style="margin-top:0">⚙️ ${t('settings')}</h2>
  <label for="sL">${t('language')}</label><select id="sL"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
  <label for="sT">${t('theme')}</label><select id="sT"><option value="auto">${t('tAuto')}</option><option value="light">${t('tLight')}</option><option value="dark">${t('tDark')}</option></select>
  <label for="sTone">${t('tone')}</label><div class="row2"><select id="sTone"><option value="bell">${t('tBell')}</option><option value="digital">${t('tDigital')}</option><option value="melody">${t('tMelody')}</option></select><button class="btn sec" id="sTest">▶ ${t('test')}</button></div>
  <label class="days" style="display:flex;gap:8px;margin-top:10px;border:0;padding:0"><input type="checkbox" id="sV" style="width:auto;min-height:0" ${S.voice?'checked':''}> ${t('voice')}</label>
  <label class="days" style="display:flex;gap:8px;border:0;padding:0"><input type="checkbox" id="sB" style="width:auto;min-height:0" ${S.big?'checked':''}> ${t('bigText')}</label>
  <h2>${t('backup')}</h2><div class="row2"><button class="btn sec" id="sExp">${t('export')}</button><button class="btn sec" id="sImp">${t('import')}</button></div><input type="file" id="sFile" accept="application/json,.json" hidden>
  <div style="margin-top:12px">${deferred?`<button class="btn block" id="sInst">${t('install')}</button>`:`<p class="sub">${t('installIos')}</p>`}</div>
  <button class="btn ghost block" style="margin-top:14px" id="sClose">${t('cancel')}</button>`);
  $('#sL').value=S.lang;$('#sT').value=S.theme;$('#sTone').value=S.tone;
  $('#sL').onchange=e=>{S.lang=e.target.value;save();settingsModal();render()};
  $('#sT').onchange=e=>{S.theme=e.target.value;save();render()};
  $('#sTone').onchange=e=>{S.tone=e.target.value;save();beep()};$('#sTest').onclick=()=>{beep();speak(VOICE[S.lang][1]+' '+(myMeds()[0]?myMeds()[0].name:'Sahati'))};
  $('#sV').onchange=e=>{S.voice=e.target.checked;save()};$('#sB').onchange=e=>{S.big=e.target.checked;save();render()};
  $('#sExp').onclick=()=>down('sahati-backup-'+ymd(new Date())+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));
  $('#sImp').onclick=()=>$('#sFile').click();
  $('#sFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.meds)||!o.log)throw 0;
    if(!confirm(t('importAsk')))return;S=Object.assign({},DEF,o);if(!S.patients||!S.patients.length){S.patients=[Object.assign({id:'p1'},o.profile||{})];S.cur='p1';S.meds.forEach(m=>m.pid='p1')}
    if(!S.patients.find(p=>p.id===S.cur))S.cur=S.patients[0].id;save();closeModal();render();toast('✓ '+t('importOk'))}catch(x){toast(t('importBad'))}};r.readAsText(f)};
  const si=$('#sInst');if(si)si.onclick=()=>{deferred.prompt();deferred=null;closeModal()};
  $('#sClose').onclick=closeModal;
}
function shareStatus(){
  const now=new Date(),d=ymd(now),dz=dosesFor(now,false),p=P();
  const done=dz.filter(x=>(S.log[keyOf(d,x)]||{}).s==='taken'),pend=dz.filter(x=>!S.log[keyOf(d,x)]);
  const txt=`💊 ${t('summary')} — ${p.name||''} (${d})\n✅ ${done.length}/${dz.length}\n`+(pend.length?`⏳ ${t('pendingW')}: `+pend.map(x=>x.med.name+' '+x.time).join('، '):'');
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else{const ph=(p.famPhone||'').replace(/\D/g,'');window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(txt),'_blank','noopener')}
}

/* ================= events ================= */
function bind(){
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  q('[data-take]',b=>b.onclick=()=>{const k=b.dataset.take;setStatus(k,'taken');render();const m=S.meds.find(x=>x.id===k.split('|')[1]);m&&lowToast(m)});
  q('[data-skip]',b=>b.onclick=()=>{setStatus(b.dataset.skip,'skipped');render()});
  q('[data-prn]',b=>b.onclick=()=>{const n=new Date(),m=S.meds.find(x=>x.id===b.dataset.prn);setStatus(ymd(n)+'|'+m.id+'|'+p2(n.getHours())+':'+p2(n.getMinutes()),'taken');toast('✓ '+m.name);lowToast(m);render()});
  q('[data-go]',b=>b.onclick=()=>{tab=b.dataset.go;render()});
  q('[data-pharm]',b=>b.onclick=()=>window.open('https://www.google.com/maps/search/'+({ar:'صيدلية+قريبة',fr:'pharmacie+à+proximité',en:'pharmacy+near+me'})[S.lang],'_blank','noopener'));
  q('[data-fam]',b=>b.onclick=()=>{const i=+b.dataset.fam,k=S.alerts[i],[,id,tm]=k.split('|'),m=S.meds.find(x=>x.id===id),p=m?patOf(m):P();
    const ph=(p.famPhone||'').replace(/\D/g,'');if(!ph){toast(t('noFamily'));S.cur=p.id;tab='profile';render();return}
    window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(FAM[S.lang](p.name,m?m.name:'',tm)),'_blank','noopener');S.alerts.splice(i,1);save();render()});
  q('[data-dis]',b=>b.onclick=()=>{S.alerts.splice(+b.dataset.dis,1);save();render()});
  q('[data-edit]',b=>{b.onclick=()=>medForm(b.dataset.edit);b.onkeydown=e=>{if(e.key==='Enter')medForm(b.dataset.edit)}});
  q('[data-vt]',b=>b.onclick=()=>{vt=b.dataset.vt;render()});
  q('[data-delv]',b=>b.onclick=()=>{S.vitals=S.vitals.filter(v=>v.id!==b.dataset.delv);save();render()});
  q('[data-dela]',b=>b.onclick=()=>{if(confirm(t('confirmDel'))){S.appts=S.appts.filter(a=>a.id!==b.dataset.dela);save();render()}});
  const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
  on('#addMed',()=>medForm());on('#addAppt',apptForm);on('#shareBtn',shareStatus);on('#printBtn',()=>window.print());on('#emBtn2',emergencyModal);
  on('#notifBtn',()=>Notification.requestPermission().then(render));
  on('#addV',()=>{const a=$('#vA').value,b=vt==='bp'?$('#vB').value:'';if(!a||(vt==='bp'&&!b))return;
    S.vitals.push({id:uid(),pid:S.cur,type:vt,ts:Date.now(),a,b});if(vt==='weight')P().weight=a;save();render();toast('✓ '+t('saved'))});
  on('#delPat',()=>{if(!confirm(t('confirmDel')))return;const id=S.cur;S.patients=S.patients.filter(p=>p.id!==id);S.meds=S.meds.filter(m=>m.pid!==id);S.vitals=S.vitals.filter(v=>v.pid!==id);S.appts=S.appts.filter(a=>a.pid!==id);S.cur=S.patients[0].id;save();render()});
  on('#saveProfile',()=>{Object.assign(P(),{name:$('#pName').value.trim(),age:$('#pAge').value,weight:$('#pWeight').value,blood:$('#pBlood').value,allergy:$('#pAllergy').value.trim(),fam:$('#pFam').value.trim(),famPhone:$('#pFamPhone').value.trim()});save();render();toast('✓ '+t('saved'))});
}
$('#patBtn').onclick=patientsModal;$('#emBtn').onclick=emergencyModal;$('#setBtn').onclick=settingsModal;
document.addEventListener('click',()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>S.theme==='auto'&&applyTheme());
let prevTh;window.addEventListener('beforeprint',()=>{prevTh=document.documentElement.dataset.theme;document.documentElement.dataset.theme='light'});
window.addEventListener('afterprint',()=>{document.documentElement.dataset.theme=prevTh});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(async r=>{
  try{if(r.periodicSync)await r.periodicSync.register('sahati-check',{minInterval:15*60*1000})}catch(e){}
  navigator.serviceWorker.ready.then(()=>pushSchedule())}).catch(()=>{}));
render();tick();setTimeout(initNative,800);
</script>
</body>
